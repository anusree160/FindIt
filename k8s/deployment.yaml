
apiVersion: apps/v1
kind: Deployment
metadata:
  name: findit-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: findit
  template:
    metadata:
      labels:
        app: findit
    spec:
      containers:
        - name: findit
          image: findit:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
